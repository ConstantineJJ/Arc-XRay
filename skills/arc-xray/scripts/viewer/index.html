<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<body>
<header id="header"><img src="data:image/png;base64,__ICON__" alt="Arc-XRay" width="32" height="32"><strong>Arc-XRay</strong><span id="project-name"></span><span class="badge" data-i18n="readOnly"></span><select id="language" aria-label="Language"><option value="en">English</option><option value="ru">Русский</option></select></header>
<div id="shell">

<footer id="status"><span id="counts"></span><span data-i18n="gestures"></span></footer>
</main><aside id="inspector" aria-live="polite"></aside>
</div>
<dialog id="log-dialog" aria-labelledby="log-title"><form method="dialog"><div class="row"><h2 id="log-title" data-i18n="logTitle"></h2><button aria-label="Close">×</button></div></form><div id="log-items"></div><label><span data-i18n="filename"></span><input id="log-filename"></label><label><span data-i18n="format"></span><select id="log-format"><option value="md">Markdown</option><option value="json">JSON</option></select></label><label><span data-i18n="comment"></span><textarea id="log-comment" rows="2"></textarea></label><details><summary data-i18n="preview"></summary><pre id="log-preview"></pre></details><p class="muted" id="save-note"></p><p id="save-status" role="status"></p><div class="row"><button id="save-log" data-i18n="saveAs"></button><button id="download-log" data-i18n="download"></button></div></dialog>
